<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 310" width="310" height="310" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <!-- Neon Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- REC Red Glow Filter -->
    <filter id="recGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lens Subtle Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3a"/>
      <stop offset="50%" stop-color="#191a24"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>

    <!-- App Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="310" height="310" rx="68" ry="68"/>
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <g clip-path="url(#squircleClip)">
    <rect width="310" height="310" fill="url(#bgGrad)"/>
    <rect width="310" height="310" fill="none" stroke="#262835" stroke-width="2"/>

    <!-- Subtle Ambient Cyan Underglow -->
    <circle cx="155" cy="120" r="90" fill="#00f2c3" opacity="0.08"/>

    <!-- Camera Lens Unit -->
    <g transform="translate(155, 122)">
      <!-- Outer Cyan Neon Ring -->
      <circle cx="0" cy="0" r="62" stroke="#00f2c3" stroke-width="7" fill="none" filter="url(#cyanGlow)"/>
      
      <!-- Inner Dark Lens Body -->
      <circle cx="0" cy="0" r="58.5" fill="url(#lensGrad)"/>
      <circle cx="0" cy="0" r="54" stroke="#12131a" stroke-width="2" fill="none"/>
      
      <!-- Center Lens Aperture Element -->
      <circle cx="0" cy="0" r="23" fill="#08080c"/>
      <circle cx="0" cy="0" r="22" stroke="#1e2029" stroke-width="1.5" fill="none"/>

      <!-- Optical Glass Reflection Arc -->
      <path d="M -30 -35 A 48 48 0 0 1 28 -37" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.18"/>

      <!-- Red REC Indicator Dot (Top Right) -->
      <circle cx="50" cy="-52" r="9.5" fill="#ef4444" filter="url(#recGlow)"/>
      <circle cx="51" cy="-53" r="3" fill="#ff8585" opacity="0.6"/>
    </g>

    <!-- Piano Keyboard Element (Bottom Half) -->
    <!-- Bounds: X from 51 to 259 (Width 208, 7 keys * 29.7px approx), Y from 188 to 258 (Height 70) -->
    <g transform="translate(51, 187)">
      <!-- Key 1: White -->
      <rect x="0" y="0" width="28.5" height="71" rx="2" fill="#f4f4f7"/>
      <!-- Key 2: White -->
      <rect x="30" y="0" width="28.5" height="71" rx="2" fill="#f4f4f7"/>
      <!-- Key 3: Active Cyan Neon -->
      <rect x="60" y="0" width="28.5" height="71" rx="2" fill="#00f2c3" filter="url(#cyanGlow)"/>
      <!-- Key 4: White -->
      <rect x="90" y="0" width="28.5" height="71" rx="2" fill="#f4f4f7"/>
      <!-- Key 5: Active Cyan Neon -->
      <rect x="120" y="0" width="28.5" height="71" rx="2" fill="#00f2c3" filter="url(#cyanGlow)"/>
      <!-- Key 6: White -->
      <rect x="150" y="0" width="28.5" height="71" rx="2" fill="#f4f4f7"/>
      <!-- Key 7: Active Cyan Neon -->
      <rect x="180" y="0" width="28" height="71" rx="2" fill="#00f2c3" filter="url(#cyanGlow)"/>

      <!-- Black Keys -->
      <!-- Black Key 1 (between Key 1 & 2) -->
      <rect x="21" y="0" width="16.5" height="42" rx="1.5" fill="#09090b"/>
      <!-- Black Key 2 (between Key 2 & 3) -->
      <rect x="51" y="0" width="16.5" height="42" rx="1.5" fill="#09090b"/>
      <!-- Gap between Key 3 & 4 (E/F step) -->
      <!-- Black Key 3 (between Key 4 & 5) -->
      <rect x="111" y="0" width="16.5" height="42" rx="1.5" fill="#09090b"/>
      <!-- Black Key 4 (between Key 5 & 6) -->
      <rect x="141" y="0" width="16.5" height="42" rx="1.5" fill="#09090b"/>
      <!-- Black Key 5 (between Key 6 & 7) -->
      <rect x="171" y="0" width="16.5" height="42" rx="1.5" fill="#09090b"/>

      <!-- Subtle Key Separator Lines / Shadows -->
      <rect x="21" y="40" width="16.5" height="2" fill="#000000" opacity="0.5"/>
      <rect x="51" y="40" width="16.5" height="2" fill="#000000" opacity="0.5"/>
      <rect x="111" y="40" width="16.5" height="2" fill="#000000" opacity="0.5"/>
      <rect x="141" y="40" width="16.5" height="2" fill="#000000" opacity="0.5"/>
      <rect x="171" y="40" width="16.5" height="2" fill="#000000" opacity="0.5"/>
    </g>

    <!-- Border highlight -->
    <rect x="0" y="0" width="310" height="310" rx="68" ry="68" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  </g>
</svg>
